version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mirgor_db
    environment:
      POSTGRES_USER: ${DB_USER:-mirgor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mirgor123}
      POSTGRES_DB: ${DB_NAME:-mirgor_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mirgor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mirgor_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mirgor}
      DB_PASSWORD: ${DB_PASSWORD:-mirgor123}
      DB_NAME: ${DB_NAME:-mirgor_db}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mirgor_app
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: